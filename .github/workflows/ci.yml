name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@c6a25f27df25f4db73b2148e0176f7e75a10b6d1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run smoke
      - run: node bin/pi-callscript.mjs
      - run: npm pack --dry-run

  pi-compatibility:
    name: Pi ${{ matrix.pi-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: [legacy, locked, latest]

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@c6a25f27df25f4db73b2148e0176f7e75a10b6d1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Use Pi 0.84.4 packages
        if: matrix.pi-version == 'legacy'
        run: >-
          bun add --dev --ignore-scripts
          @earendil-works/pi-coding-agent@0.84.4
          @earendil-works/pi-tui@0.84.4
      - name: Use latest Pi packages
        if: matrix.pi-version == 'latest'
        run: >-
          bun add --dev --ignore-scripts
          @earendil-works/pi-coding-agent@latest
          @earendil-works/pi-tui@latest
      - name: Record resolved Pi package versions
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const packages = [
            "@earendil-works/pi-coding-agent",
            "@earendil-works/pi-tui",
          ];
          for (const name of packages) {
            const manifest = `node_modules/${name}/package.json`;
            const { version } = JSON.parse(
              fs.readFileSync(manifest, "utf8"),
            );
            const line = `${name}@${version}`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${line}\n`);
          }
          NODE
      - run: bun run typecheck
      - run: bun run test
      - run: bun run smoke
