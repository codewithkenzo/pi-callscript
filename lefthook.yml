pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,json,jsonc,md,yml,yaml}"
      run: "./node_modules/.bin/oxfmt {staged_files} --write"
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,mjs}"
      run: "./node_modules/.bin/oxlint --deny-warnings {staged_files}"

pre-push:
  commands:
    verify:
      run: "bun run check"
